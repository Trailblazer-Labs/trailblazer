name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        platform:
          - name: macOS
            runner: macos-latest
            script: release:mac
          - name: Windows
            runner: windows-latest
            script: release:win

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # node-pty's bundled node-gyp 9.x imports `distutils` which was removed in
      # Python 3.12+. Pin Python 3.11 so the native rebuild succeeds.
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Set release version
        shell: bash
        run: |
          BASE_VERSION="$(node -p "const v = require('./package.json').version.split('.'); v[0] + '.' + v[1]")"
          APP_VERSION="${BASE_VERSION}.${GITHUB_RUN_NUMBER}"
          npm version "$APP_VERSION" --no-git-tag-version --allow-same-version
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

      - name: Typecheck
        run: npm run typecheck

      - name: Publish ${{ matrix.platform.name }} release
        run: npm run ${{ matrix.platform.script }}
        env:
          GH_TOKEN: ${{ github.token }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # Sanity check: the README download links expect exactly these filenames,
      # produced by the `artifactName` template in package.json. Fail loudly here
      # rather than ship a release whose URLs 404.
      - name: Verify release artifacts match README download URLs
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.platform.name }}" in
            macOS)
              expected=("Trailblazer-mac-arm64.dmg" "Trailblazer-mac-x64.dmg")
              ;;
            Windows)
              expected=("Trailblazer-win-x64.exe")
              ;;
            *)
              echo "Unknown platform"; exit 1 ;;
          esac
          missing=()
          for f in "${expected[@]}"; do
            if [ ! -f "dist/$f" ]; then
              missing+=("$f")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "Expected artifacts missing from dist/: ${missing[*]}"
            echo "Actual contents:"
            ls -la dist/
            exit 1
          fi
          echo "All expected artifacts present:"
          for f in "${expected[@]}"; do
            echo "  dist/$f"
          done
