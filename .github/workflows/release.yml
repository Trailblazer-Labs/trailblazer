name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md
      - docs/**
      - '**/*.md'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.gif'
      - '**/*.webp'
      - '**/*.svg'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        platform:
          - name: macOS
            runner: macos-latest
            script: release:mac
          - name: Windows
            runner: windows-latest
            script: release:win

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # node-pty's bundled node-gyp 9.x imports `distutils` which was removed in
      # Python 3.12+. Pin Python 3.11 so the native rebuild succeeds.
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        # --foreground-scripts streams native compile output live so a slow build
        # doesn't look like a hang. --no-audit --no-fund trims unrelated noise.
        run: npm ci --foreground-scripts --no-audit --no-fund

      - name: Set release version
        shell: bash
        run: |
          BASE_VERSION="$(node -p "const v = require('./package.json').version.split('.'); v[0] + '.' + v[1]")"
          APP_VERSION="${BASE_VERSION}.${GITHUB_RUN_NUMBER}"
          npm version "$APP_VERSION" --no-git-tag-version --allow-same-version
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

      - name: Typecheck
        run: npm run typecheck

      # Pass signing env vars only when they're actually configured. An empty CSC_LINK
      # makes electron-builder treat "" as a file path and fail. Values written via
      # GITHUB_ENV are auto-masked by GitHub Actions so secrets stay out of logs.
      - name: Configure code signing
        shell: bash
        env:
          CSC_LINK_VALUE: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD_VALUE: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID_VALUE: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD_VALUE: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID_VALUE: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$CSC_LINK_VALUE" ]; then
            echo "CSC_LINK=$CSC_LINK_VALUE" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$CSC_KEY_PASSWORD_VALUE" >> "$GITHUB_ENV"
            echo "APPLE_ID=$APPLE_ID_VALUE" >> "$GITHUB_ENV"
            echo "APPLE_APP_SPECIFIC_PASSWORD=$APPLE_APP_SPECIFIC_PASSWORD_VALUE" >> "$GITHUB_ENV"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID_VALUE" >> "$GITHUB_ENV"
            echo "::notice::Code signing enabled"
          else
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            echo "::warning::Code signing skipped (CSC_LINK secret not set). Unsigned builds will trigger Gatekeeper warnings on macOS."
          fi

      - name: Publish ${{ matrix.platform.name }} release
        run: npm run ${{ matrix.platform.script }}
        env:
          GH_TOKEN: ${{ github.token }}

      # Sanity check: the README download links expect exactly these filenames,
      # produced by the `artifactName` template in package.json. Fail loudly here
      # rather than ship a release whose URLs 404.
      - name: Verify release artifacts match README download URLs
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.platform.name }}" in
            macOS)
              expected=("Trailblazer-mac-arm64.dmg" "Trailblazer-mac-x64.dmg")
              ;;
            Windows)
              expected=("Trailblazer-win-x64.exe")
              ;;
            *)
              echo "Unknown platform"; exit 1 ;;
          esac
          missing=()
          for f in "${expected[@]}"; do
            if [ ! -f "dist/$f" ]; then
              missing+=("$f")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "Expected artifacts missing from dist/: ${missing[*]}"
            echo "Actual contents:"
            ls -la dist/
            exit 1
          fi
          echo "All expected artifacts present:"
          for f in "${expected[@]}"; do
            echo "  dist/$f"
          done
