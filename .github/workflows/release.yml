name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        platform:
          - name: macOS
            runner: macos-latest
            script: release:mac
          - name: Windows
            runner: windows-latest
            script: release:win

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set release version
        shell: bash
        run: |
          BASE_VERSION="$(node -p "const v = require('./package.json').version.split('.'); v[0] + '.' + v[1]")"
          APP_VERSION="${BASE_VERSION}.${GITHUB_RUN_NUMBER}"
          npm version "$APP_VERSION" --no-git-tag-version --allow-same-version
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

      - name: Typecheck
        run: npm run typecheck

      - name: Publish ${{ matrix.platform.name }} release
        run: npm run ${{ matrix.platform.script }}
        env:
          GH_TOKEN: ${{ github.token }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
